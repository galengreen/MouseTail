name: Release

# Push a tag like v0.1.0 to build MouseTail for Mac and Linux and publish a GitHub release.
# Every download is signed with the release key (secret UPDATE_SIGNING_KEY), and the release
# carries latest.json (Linux) and appcast.xml (Mac, for Sparkle), which installed copies check
# to update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Run by hand only from main (it signs and publishes)
        if: github.ref_type != 'tag' && github.ref != 'refs/heads/main'
        run: |
          echo "releases come from a tag or main, not $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches Cargo.toml's version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

  linux:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libopus-dev libxkbcommon-dev clang pkg-config
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*.tar.gz

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Sign with the same certificate every time, so macOS keeps MouseTail's permissions
      # across updates.
      - name: Signing certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - run: scripts/package-mac.sh
      - name: The app is signed with the release certificate
        run: codesign -dr - dist/MouseTail.app 2>&1 | grep -q 'certificate leaf = H"bbedfafe07206a1e8e8362c1b56dcfdee72d35c6"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            dist/MouseTail-macos.dmg
            dist/MouseTail-macos.zip

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Sign the downloads and write the update feeds
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/write-update-feeds.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          # A new release stays a draft until every file is up, so "latest" never points at a
          # release whose downloads are missing.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "MouseTail $tag" --notes-file .github/release-notes.md
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false
