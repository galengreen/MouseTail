name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # Browsers keep the stylesheet, script and images for hours; give each deploy its own
      # URLs so visitors get the new files as soon as the page itself refreshes.
      - name: Version the asset links
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(style\.css|demo\.js|logo\.png|logo-mouse\.svg|favicon\.png|menubar\.svg|art/hero\.webp)\"#\1=\"\2?v=$v\"#g" website/index.html
          sed -i -E "s#url\(\"art/((hero[a-z-]*|cards/[a-z]+)\.webp)\"\)#url(\"art/\1?v=$v\")#g" website/style.css
          grep -c "?v=$v" website/index.html website/style.css
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
