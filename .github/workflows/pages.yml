name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep the stylesheet, script and images for hours; give each deploy its own
      # URLs so visitors get the new files as soon as the page itself refreshes.
      - name: Version the asset links
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(style\.css|demo\.js|logo\.png|logo-mouse\.svg|favicon\.png|menubar\.svg|art/hero\.webp)\"#\1=\"\2?v=$v\"#g" website/index.html
          sed -i -E "s#url\(\"art/((hero[a-z-]*|cards/[a-z]+)\.webp)\"\)#url(\"art/\1?v=$v\")#g" website/style.css
          grep -c "?v=$v" website/index.html website/style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
